<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigmore's Glory - Infinite Sigma Gallery</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .header {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease-in-out infinite;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .input-section {
            max-width: 600px;
            margin: 0 auto 3rem;
            padding: 0 2rem;
        }

        .input-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .sigma-input {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .sigma-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .sigma-input:focus {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        .generate-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 15px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            font-size: 1.2rem;
            margin: 2rem 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sigmore-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sigmore-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .sigmore-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .sigmore-card:hover .sigmore-image {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem;
        }

        .sigma-prompt {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #4ecdc4;
        }

        .power-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-weight: bold;
            color: #ff6b6b;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .stat-value {
            color: white;
            font-size: 0.9rem;
        }

        .abilities {
            margin-bottom: 1rem;
        }

        .abilities-title {
            font-weight: bold;
            color: #4ecdc4;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .ability-list {
            list-style: none;
            padding: 0;
        }

        .ability-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 0.8rem;
            margin-bottom: 0.3rem;
            border-radius: 15px;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .original-input {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1rem;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .username {
            font-weight: bold;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .trade-controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .trade-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        .trade-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .my-sigmore {
            border: 2px solid #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #4ecdc4;
            text-align: center;
        }

        .sigmore-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }

        .mini-sigmore {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .mini-sigmore:hover {
            transform: scale(1.05);
        }

        .mini-sigmore.selected {
            border-color: #4ecdc4;
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.5);
        }

        .mini-sigmore img {
            width: 100%;
            height: 80px;
            object-fit: cover;
        }

        .mini-sigmore-info {
            padding: 0.5rem;
            font-size: 0.7rem;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .modal-btn.primary {
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            color: white;
        }

        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .trade-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1001;
            max-width: 350px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .notification-title {
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 0.5rem;
        }

        .notification-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .notification-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .notification-btn.accept {
            background: #4ecdc4;
            color: white;
        }

        .notification-btn.reject {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useSyncExternalStore } = React;
        
        // Initialize WebsimSocket
        const room = new WebsimSocket();

        function SigmoreGallery() {
            const [sigmaInput, setSigmaInput] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [showTradeModal, setShowTradeModal] = useState(false);
            const [targetSigmore, setTargetSigmore] = useState(null);
            const [selectedTrades, setSelectedTrades] = useState([]);
            const [currentUser, setCurrentUser] = useState(null);
            const [tradeNotification, setTradeNotification] = useState(null);
            const [pendingTrades, setPendingTrades] = useState(new Set());
            const [isExecutingTrade, setIsExecutingTrade] = useState(false);
            
            // Get sigmore records from database
            const sigmores = useSyncExternalStore(
                room.collection('sigmore').subscribe,
                room.collection('sigmore').getList
            );

            useEffect(() => {
                const initUser = async () => {
                    const user = await window.websim.getCurrentUser();
                    setCurrentUser(user);
                };
                initUser();

                // Initialize room for trade notifications
                room.initialize();

                // Listen for trade offers
                room.onmessage = (event) => {
                    const data = event.data;
                    if (data.type === 'trade_offer' && data.targetUser === currentUser?.username) {
                        setTradeNotification(data);
                    } else if (data.type === 'trade_response') {
                        if (data.accepted) {
                            alert(`Trade accepted! Your Sigmores have been exchanged.`);
                        } else {
                            alert(`Trade declined by ${data.from}.`);
                        }
                    }
                };
            }, [currentUser?.username]);

            const generateSigmore = async () => {
                if (!sigmaInput.trim() || isGenerating) return;
                
                setIsGenerating(true);
                
                try {
                    // Use LLM to make the input more "Sigma"
                    const sigmaCompletion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "system",
                                content: `You are the ultimate Sigma interpreter. Take any input and transform it into the most SIGMA, alpha, grindset-focused version possible. Make it extremely over-the-top sigma male energy. Include terms like "sigma grindset", "alpha energy", "based", "gigachad", etc. Make it sound like the most sigma thing ever conceived. Respond with just the enhanced sigma prompt, no explanations.`
                            },
                            {
                                role: "user",
                                content: sigmaInput
                            }
                        ]
                    });

                    const sigmaPrompt = sigmaCompletion.content;

                    // Generate image of Sigmore with the sigma prompt
                    const imageResult = await websim.imageGen({
                        prompt: `Sigmore the ultimate sigma websim mascot, ${sigmaPrompt}, extremely sigma energy, alpha male, grindset, based, gigachad aesthetic, powerful pose, confident expression, digital art style`,
                        aspect_ratio: "1:1"
                    });

                    // Generate Sigmore power card stats
                    const statsCompletion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "system",
                                content: `You are creating a power card for a Sigmore character. Generate unique stats in JSON format with no other text. Make it extremely sigma/alpha themed with over-the-top abilities.
                                
{
  "weight": "number with unit (lbs)",
  "height": "number with unit (ft)",
  "fighting_style": "unique sigma fighting style name",
  "special_abilities": ["ability 1", "ability 2", "ability 3"],
  "power_level": "number out of 9000",
  "sigma_rank": "rank like Alpha Prime, Omega Supreme, etc"
}`
                            },
                            {
                                role: "user", 
                                content: `Create power card stats for: ${sigmaPrompt}`
                            }
                        ],
                        json: true
                    });

                    const stats = JSON.parse(statsCompletion.content);

                    // Save to database
                    await room.collection('sigmore').create({
                        original_input: sigmaInput,
                        sigma_prompt: sigmaPrompt,
                        image_url: imageResult.url,
                        stats: stats,
                        username: currentUser?.username
                    });

                    setSigmaInput('');
                } catch (error) {
                    console.error('Error generating Sigmore:', error);
                    alert('Failed to generate Sigmore. Please try again.');
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !isGenerating) {
                    generateSigmore();
                }
            };

            const openTradeModal = (sigmore) => {
                if (sigmore.username === currentUser?.username) return;
                if (pendingTrades.has(sigmore.id)) return; // Prevent trading if already pending
                setTargetSigmore(sigmore);
                setSelectedTrades([]);
                setShowTradeModal(true);
            };

            const toggleTradeSelection = (sigmore) => {
                setSelectedTrades(prev => {
                    const isSelected = prev.find(s => s.id === sigmore.id);
                    if (isSelected) {
                        return prev.filter(s => s.id !== sigmore.id);
                    } else {
                        return [...prev, sigmore];
                    }
                });
            };

            const sendTradeOffer = () => {
                if (selectedTrades.length === 0) return;
                if (pendingTrades.has(targetSigmore.id)) return; // Prevent duplicate offers
                
                // Add to pending trades
                setPendingTrades(prev => new Set([...prev, targetSigmore.id]));
                
                room.send({
                    type: 'trade_offer',
                    targetUser: targetSigmore.username,
                    targetSigmore: targetSigmore,
                    offeredSigmores: selectedTrades,
                    from: currentUser.username,
                    tradeId: `${Date.now()}-${Math.random()}`, // Unique trade ID
                    echo: false
                });

                setShowTradeModal(false);
                alert(`Trade offer sent to ${targetSigmore.username}!`);
            };

            const handleTradeResponse = async (accepted) => {
                if (!tradeNotification || isExecutingTrade) return;
                
                setIsExecutingTrade(true);
                
                try {
                    if (accepted) {
                        const { targetSigmore, offeredSigmores, tradeId } = tradeNotification;
                        
                        // Validate all sigmores still exist and belong to correct users
                        const currentSigmores = room.collection('sigmore').getList();
                        
                        // Check target sigmore still exists and belongs to current user
                        const validTargetSigmore = currentSigmores.find(s => 
                            s.id === targetSigmore.id && s.username === currentUser.username
                        );
                        
                        if (!validTargetSigmore) {
                            throw new Error('Target Sigmore no longer exists or ownership changed');
                        }
                        
                        // Check all offered sigmores still exist and belong to the offering user
                        const validOfferedSigmores = [];
                        for (const offered of offeredSigmores) {
                            const validOffered = currentSigmores.find(s => 
                                s.id === offered.id && s.username === tradeNotification.from
                            );
                            if (!validOffered) {
                                throw new Error('One or more offered Sigmores no longer exist or ownership changed');
                            }
                            validOfferedSigmores.push(validOffered);
                        }

                        // Execute trade atomically: delete first, then create
                        const deletePromises = [
                            room.collection('sigmore').delete(validTargetSigmore.id),
                            ...validOfferedSigmores.map(s => room.collection('sigmore').delete(s.id))
                        ];
                        
                        await Promise.all(deletePromises);
                        
                        // Create new sigmores with transferred ownership
                        const createPromises = [
                            // Transfer target sigmore to the offering user
                            room.collection('sigmore').create({
                                original_input: validTargetSigmore.original_input,
                                sigma_prompt: validTargetSigmore.sigma_prompt,
                                image_url: validTargetSigmore.image_url,
                                stats: validTargetSigmore.stats
                            }),
                            // Transfer offered sigmores to current user
                            ...validOfferedSigmores.map(s => 
                                room.collection('sigmore').create({
                                    original_input: s.original_input,
                                    sigma_prompt: s.sigma_prompt,
                                    image_url: s.image_url,
                                    stats: s.stats
                                })
                            )
                        ];
                        
                        await Promise.all(createPromises);

                        room.send({
                            type: 'trade_response',
                            accepted: true,
                            from: currentUser.username,
                            to: tradeNotification.from,
                            tradeId: tradeId,
                            echo: false
                        });
                    } else {
                        room.send({
                            type: 'trade_response',
                            accepted: false,
                            from: currentUser.username,
                            to: tradeNotification.from,
                            tradeId: tradeNotification.tradeId,
                            echo: false
                        });
                    }
                } catch (error) {
                    console.error('Trade execution failed:', error);
                    alert(`Trade failed: ${error.message}`);
                    
                    // Send failure notification
                    room.send({
                        type: 'trade_response',
                        accepted: false,
                        error: error.message,
                        from: currentUser.username,
                        to: tradeNotification.from,
                        tradeId: tradeNotification.tradeId,
                        echo: false
                    });
                } finally {
                    setIsExecutingTrade(false);
                    setTradeNotification(null);
                    // Remove from pending trades
                    setPendingTrades(prev => {
                        const newSet = new Set(prev);
                        newSet.delete(tradeNotification?.targetSigmore?.id);
                        return newSet;
                    });
                }
            };

            const mySignores = sigmores.filter(s => s.username === currentUser?.username);

            return (
                <div>
                    <div className="header">
                        <h1 className="title">Sigmore's Glory</h1>
                        <p className="subtitle">The Infinite Gallery of Sigma Supremacy</p>
                        
                        <div className="input-section">
                            <div className="input-container">
                                <input
                                    type="text"
                                    className="sigma-input"
                                    placeholder="Enter your sigma words... (they will become MORE sigma)"
                                    value={sigmaInput}
                                    onChange={(e) => setSigmaInput(e.target.value)}
                                    onKeyPress={handleKeyPress}
                                    disabled={isGenerating}
                                />
                                <button
                                    className="generate-btn"
                                    onClick={generateSigmore}
                                    disabled={isGenerating || !sigmaInput.trim()}
                                >
                                    {isGenerating ? (
                                        <>
                                            <span className="loading-spinner"></span>
                                            Generating...
                                        </>
                                    ) : (
                                        'Generate Sigmore'
                                    )}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="gallery">
                        {sigmores.reverse().map((sigmore) => (
                            <div 
                                key={sigmore.id} 
                                className={`sigmore-card ${sigmore.username === currentUser?.username ? 'my-sigmore' : ''}`}
                            >
                                <img
                                    src={sigmore.image_url}
                                    alt={`Sigmore: ${sigmore.sigma_prompt}`}
                                    className="sigmore-image"
                                />
                                <div className="card-content">
                                    <div className="sigma-prompt">{sigmore.sigma_prompt}</div>
                                    
                                    {sigmore.stats && (
                                        <>
                                            <div className="power-stats">
                                                <div className="stat-item">
                                                    <div className="stat-label">Height</div>
                                                    <div className="stat-value">{sigmore.stats.height}</div>
                                                </div>
                                                <div className="stat-item">
                                                    <div className="stat-label">Weight</div>
                                                    <div className="stat-value">{sigmore.stats.weight}</div>
                                                </div>
                                                <div className="stat-item">
                                                    <div className="stat-label">Power Level</div>
                                                    <div className="stat-value">{sigmore.stats.power_level}</div>
                                                </div>
                                                <div className="stat-item">
                                                    <div className="stat-label">Sigma Rank</div>
                                                    <div className="stat-value">{sigmore.stats.sigma_rank}</div>
                                                </div>
                                            </div>
                                            
                                            <div className="stat-item" style={{gridColumn: '1 / -1', marginBottom: '1rem'}}>
                                                <div className="stat-label">Fighting Style</div>
                                                <div className="stat-value">{sigmore.stats.fighting_style}</div>
                                            </div>
                                            
                                            <div className="abilities">
                                                <div className="abilities-title">Special Abilities</div>
                                                <ul className="ability-list">
                                                    {sigmore.stats.special_abilities?.map((ability, index) => (
                                                        <li key={index} className="ability-item">{ability}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                        </>
                                    )}
                                    
                                    <div className="original-input">
                                        Original: "{sigmore.original_input}"
                                    </div>
                                    <div className="card-meta">
                                        <span className="username">@{sigmore.username}</span>
                                        <span>{new Date(sigmore.created_at).toLocaleDateString()}</span>
                                    </div>

                                    {currentUser && sigmore.username !== currentUser.username && (
                                        <div className="trade-controls">
                                            <button 
                                                className="trade-btn"
                                                onClick={() => openTradeModal(sigmore)}
                                                disabled={pendingTrades.has(sigmore.id)}
                                            >
                                                {pendingTrades.has(sigmore.id) ? '⏳ Pending...' : '🔄 Offer Trade'}
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>

                    {showTradeModal && (
                        <div className="modal-overlay" onClick={() => setShowTradeModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-title">
                                    Trade Offer for @{targetSigmore?.username}'s Sigmore
                                </div>
                                
                                <div>
                                    <h4>Target Sigmore:</h4>
                                    <div className="mini-sigmore">
                                        <img src={targetSigmore?.image_url} alt="Target Sigmore" />
                                        <div className="mini-sigmore-info">
                                            {targetSigmore?.sigma_prompt?.substring(0, 30)}...
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <h4>Select Your Sigmores to Trade:</h4>
                                    <div className="sigmore-grid">
                                        {mySignores.map((sigmore) => (
                                            <div 
                                                key={sigmore.id}
                                                className={`mini-sigmore ${selectedTrades.find(s => s.id === sigmore.id) ? 'selected' : ''}`}
                                                onClick={() => toggleTradeSelection(sigmore)}
                                            >
                                                <img src={sigmore.image_url} alt="My Sigmore" />
                                                <div className="mini-sigmore-info">
                                                    {sigmore.sigma_prompt?.substring(0, 20)}...
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    {mySignores.length === 0 && (
                                        <p>You need to create some Sigmores first!</p>
                                    )}
                                </div>

                                <div className="modal-buttons">
                                    <button 
                                        className="modal-btn secondary"
                                        onClick={() => setShowTradeModal(false)}
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        className="modal-btn primary"
                                        onClick={sendTradeOffer}
                                        disabled={selectedTrades.length === 0 || pendingTrades.has(targetSigmore?.id)}
                                    >
                                        {pendingTrades.has(targetSigmore?.id) ? 'Trade Pending...' : `Send Trade Offer (${selectedTrades.length} Sigmores)`}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {tradeNotification && (
                        <div className="trade-notification">
                            <div className="notification-title">
                                Trade Offer from @{tradeNotification.from}
                            </div>
                            <div>
                                Wants your: {tradeNotification.targetSigmore.sigma_prompt?.substring(0, 40)}...
                            </div>
                            <div>
                                Offering: {tradeNotification.offeredSigmores.length} Sigmore(s)
                            </div>
                            <div className="notification-buttons">
                                <button 
                                    className="notification-btn accept"
                                    onClick={() => handleTradeResponse(true)}
                                    disabled={isExecutingTrade}
                                >
                                    {isExecutingTrade ? 'Processing...' : 'Accept'}
                                </button>
                                <button 
                                    className="notification-btn reject"
                                    onClick={() => handleTradeResponse(false)}
                                    disabled={isExecutingTrade}
                                >
                                    Decline
                                </button>
                            </div>
                        </div>
                    )}

                    {sigmores.length === 0 && (
                        <div className="loading">
                            <p>No Sigmores yet! Be the first to create one! 💪</p>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<SigmoreGallery />, document.getElementById('root'));
    </script>
